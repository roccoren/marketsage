# Backtesting configuration

# Data settings
data:
  provider_uri: "~/.qlib/qlib_data/us_data"
  region: "us"
  benchmark: "SPY"

# Strategy settings
strategy:
  type: "topk"  # Options: topk, enhanced_indexing
  params:
    topk: 50
    n_drop: 5

# Backtest parameters
backtest:
  account: 100000000.0  # Initial account value
  exchange:
    limit_threshold: 0.095
    deal_price: "close"
    open_cost: 0.0005
    close_cost: 0.0015
    min_cost: 5

# Performance metrics
metrics:
  risk_free_rate: 0.02  # Annual risk-free rate
  trading_days: 252     # Number of trading days per year

# Technical indicators weights for prediction
prediction_weights:
  rsi: 0.2
  macd: 0.2
  stochastic: 0.1
  volatility: 0.1
  volume: 0.1
  momentum: 0.1
  trend: 0.1

# Output settings
output:
  save_portfolio: true
  save_metrics: true
  save_plots: true
  plot_settings:
    style: "seaborn"
    figsize: [12, 8]
    dpi: 300 