async:
  max_concurrent_tasks: 5
  max_threads: 10
backtesting:
  evaluation:
    metrics:
    - excess_return_with_cost
    - excess_return_without_cost
    - max_drawdown
    - information_ratio
    - alpha
    - beta
    - sharpe
    - annual_return
    min_trades: 10
    risk_free_rate: 0.02
  executor:
    configs:
      commission: 0.001
      deal_price: close
      limit_threshold: 0.095
      slippage: 0.001
      tax: 0.001
      trade_unit: 100
    type: SimulatorExecutor
  strategy:
    configs:
      dataset: null
      model: null
      n_drop: 5
      signal: prediction
      topk: 50
    type: TopkDropoutStrategy
connections:
  influxdb:
    bucket: stock_data
    org: stockscan
    token: stockscantoken
    url: http://128.85.51.203:8086
  mlflow:
    artifact_dir: mlruns
    experiment_name: 0420-prediction
    tracking_uri: http://128.85.51.203:5000
data_acquisition:
  retry_count: 3
  retry_delay: 5
  start_date: '2020-01-01'
  update_schedule: 0 0 * * *
error_handling:
  email_notifications:
    enabled: false
    recipients: []
    sender: ''
    smtp_port: 587
    smtp_server: ''
    subject_prefix: '[MARKETSAGE ERROR]'
events:
  enabled: true
  handlers:
    log_events: true
    store_events: false
forecasting:
  features:
    advanced:
    - ROC($close, 5)
    - BETA($close, $benchmark, 20)
    - MOMENTUM($close, 20)
    - VOLCORR($close, $volume, 20)
    price:
    - $close
    - $open
    - $high
    - $low
    - $volume
    technical:
    - RSI($close, 14)
    - MACD($close)
    - MA($close, 5)
    - MA($close, 20)
    - STD($close, 20)
    - BBand($close, 20, 2)
  horizon: 10
  models:
    lgb:
      feature_fraction: 0.8
      learning_rate: 0.1
      max_depth: 5
      num_boost_round: 100
      subsample: 0.8
    lstm:
      batch_size: 32
      dropout: 0.1
      epochs: 100
      hidden_size: 64
      num_layers: 2
  thresholds:
    buy: 0.5
    sell: -0.5
    strong_buy: 1.0
    strong_sell: -1.0
logging:
  backup_count: 5
  console: true
  file: logs/marketsage.log
  level: INFO
  max_size: 10485760
  remote:
    enabled: false
    host: ''
    port: 0
marketsage:
  expression_cache:
    enabled: true
    path: data/expression_cache
  feature_cache:
    enabled: true
    path: data/feature_cache
  logging_level: INFO
  provider_uri: data/marketsage_data
  region: us
mlflow:
  artifact_dir: mlruns
  experiment_name: marketsage
  tracking_uri: ''
storage:
  backend: csv
  csv:
    data_dir: data/csv
  sqlite:
    db_path: data/sqlite/stocks.db
  tsdb:
    connection_string: ''
    fallback_dir: data/tsdb_fallback
