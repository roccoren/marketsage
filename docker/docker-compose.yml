version: '3'

services:
  postgres:
    image: postgres:14
    container_name: mlflow-postgres
    restart: always
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marketsage-network

  mlflow:
    image: python:3.9
    container_name: mlflow-server
    restart: always
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=postgresql://mlflow:mlflow@postgres:5432/mlflow
    volumes:
      - ./mlflow:/mlflow
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      bash -c "pip install mlflow psycopg2-binary &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
               --default-artifact-root /mlflow/artifacts"
    networks:
      - marketsage-network

  influxdb:
    image: influxdb:2.0
    container_name: marketsage-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=marketsageadmin
      - DOCKER_INFLUXDB_INIT_ORG=marketsage
      - DOCKER_INFLUXDB_INIT_BUCKET=stock_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=marketsagetoken
    restart: unless-stopped
    networks:
      - marketsage-network

  dash:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dash
    container_name: marketsage-dash
    ports:
      - "8050:8050"
    environment:
      # Change this to your remote InfluxDB URL, e.g., http://your-server-ip:8086
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=marketsagetoken
      - INFLUXDB_ORG=marketsage
      - INFLUXDB_BUCKET=stock_data
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: unless-stopped
    networks:
      - marketsage-network

networks:
  marketsage-network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_artifacts:
  influxdb-data: