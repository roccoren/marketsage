version: '3.8'

services:
  datahub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketsage-datahub
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["--config", "/app/config/config.yaml"]
    networks:
      - marketsage-network
    depends_on:
      - rabbitmq
      - tsds

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: marketsage-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - marketsage-network

  tsds:
    image: influxdb:2.0
    container_name: marketsage-tsds
    ports:
      - "8086:8086"
      - "50051:50051"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=marketsage
      - DOCKER_INFLUXDB_INIT_BUCKET=marketsage
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - marketsage-network

volumes:
  rabbitmq-data:
  influxdb-data:

networks:
  marketsage-network:
    name: marketsage-network