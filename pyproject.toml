[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockscan"
version = "0.1.0"
description = "A comprehensive framework for stock analysis and backtesting"
readme = "README.md"
authors = [
    {name = "StockScan Team"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "yfinance>=0.1.70",
    "scikit-learn>=1.0.0",
    "tqdm>=4.62.0",
    "tabulate>=0.8.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.5b2",
    "isort>=5.9.1",
    "flake8>=3.9.2",
    "pytest-cov>=2.12.1",
    "mypy>=0.910"
]
docs = [
    "sphinx>=4.0.2",
    "sphinx-rtd-theme>=0.5.2"
]

[project.urls]
"Repository" = "https://github.com/yourusername/stockscan"
"Documentation" = "https://stockscan.readthedocs.io"
"Bug Tracker" = "https://github.com/yourusername/stockscan/issues"

[project.scripts]
stockscan = "stockscan.main:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["stockscan"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
force_sort_within_sections = true
skip_glob = [".*", "*/migrations/*", "*/node_modules/*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
